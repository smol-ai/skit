name: CI

on:
  push:
    branches:
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Keep existing D1 migrations unchanged
        run: |
          if [[ -n "$MIGRATION_BASE" && ! "$MIGRATION_BASE" =~ ^0+$ ]] &&
             ! git cat-file -e "${MIGRATION_BASE}^{commit}"; then
            git fetch --no-tags origin "$MIGRATION_BASE"
          fi
          node packages/skit-server-effect/scripts/check-frozen-migrations.ts "$MIGRATION_BASE" "$MIGRATION_HEAD"
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MIGRATION_HEAD: ${{ github.sha }}
      - run: pnpm --filter @smolai/skit-server-effect exec vitest run --config vitest.scripts.config.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --config vitest.lint.config.ts
      - run: pnpm --filter @smolai/skit-core test
      - run: pnpm --filter @smolai/skit-devtools test
      - run: pnpm --filter @smolai/skit-tui test
      - run: pnpm --filter @smolai/skit-storybook test

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: unit, shard: 1, shards: 4 }
          - { lane: unit, shard: 2, shards: 4 }
          - { lane: unit, shard: 3, shards: 4 }
          - { lane: unit, shard: 4, shards: 4 }
          - { lane: subprocess, shard: 1, shards: 2 }
          - { lane: subprocess, shard: 2, shards: 2 }
          - { lane: author-sync, shard: 1, shards: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smolai/skit exec vitest run --config vitest.${{ matrix.lane }}.config.ts --shard=${{ matrix.shard }}/${{ matrix.shards }}

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smolai/skit test:package

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smolai/skit-server-effect test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  check:
    if: ${{ always() }}
    needs: [quality, unit, cli, package, server, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success success success success"
