name: Release CLI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing artifact tag, e.g. @smolai/skit@0.2.0-alpha.1"
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: release-cli
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: node scripts/release-cli.mjs
