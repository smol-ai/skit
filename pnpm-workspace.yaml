packages:
  - packages/*

allowBuilds:
  esbuild: true
  msgpackr-extract: false
  sharp: false
  workerd: true

# Backport Vitest 5 support until Cloudflare releases workers-sdk#15500.
# Adapted from AdiRishi/pakshi#14 at 1d9fecfb65d419a5b255752bf2e41a775dda3433.
patchedDependencies:
  "@cloudflare/vitest-plugin@1.3.5": patches/@cloudflare__vitest-plugin@1.3.5.patch

# pnpm resolves peers from registry metadata before applying the package patch.
peerDependencyRules:
  allowedVersions:
    "@cloudflare/vitest-plugin@1.3.5>vitest": "5"

# Keep transitive Effect packages on the same stable release as our direct pins.
overrides:
  effect: 4.1.2
  "@effect/platform-node-shared": 4.1.2
  "@effect/platform-node": 4.1.2
  "@effect/platform-browser": 4.1.2

minimumReleaseAgeExclude:
  - "@effect/tsgo-darwin-arm64@0.67.5"
  - "@effect/tsgo-darwin-x64@0.67.5"
  - "@effect/tsgo-linux-arm64@0.67.5"
  - "@effect/tsgo-linux-arm@0.67.5"
  - "@effect/tsgo-linux-x64@0.67.5"
  - "@effect/tsgo-win32-arm64@0.67.5"
  - "@effect/tsgo-win32-x64@0.67.5"
  - "@effect/tsgo@0.67.5"
